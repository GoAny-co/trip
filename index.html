async function open(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(IV)},key,ub(CT)); // throws on wrong key
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),m=document.getElementById('m'),p=document.getElementById('p'),r=document.getElementById('r');

  e.preventDefault();m.textContent='กำลังเปิด…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveBits']);
